title: Naresh Kumar Devulapally
author: Naresh Devulapally

execute:
  execute_notebooks: "off"

only_build_toc_files: false

html:
  favicon: "figures/TB_favicon.ico"
  baseurl: "https://naresh-devula.github.io/"
  extra_css:
    - "_static/color.css"
    - "_static/remotion-embed.css"
  extra_js:
    - "_static/analytics.js"
    - "_static/remotion-embed.js"
    - "_static/external-links.js"

sphinx:
  config:
    # Files copied verbatim to the site root. robots.txt only counts there.
    templates_path:
      - _templates
    html_extra_path:
      - _extra
    # sphinx-sitemap writes sitemap.xml using html_baseurl (the `baseurl` above)
    sitemap_url_scheme: "{link}"
    # Open Graph + meta description: controls the Google snippet and the
    # preview card when the site is shared on LinkedIn, Slack or X.
    ogp_site_url: "https://naresh-devula.github.io/"
    ogp_site_name: "Naresh Kumar Devulapally"
    ogp_image: "https://naresh-devula.github.io/_static/naresh-ub.png"
    ogp_description_length: 200
    ogp_enable_meta_description: true
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    thebe_config:
      use_thebe_lite: true
      exclude_patterns: ["**/_*.yml", "**/*.md", "**/*.ipynb"]
      preexecute: ["thebe-init"]
    html_theme_options:
      logo:
        text: Naresh Kumar Devulapally
        image_light: figures/naresh-ub.png
        image_dark: figures/naresh-ub.png
      repository_url: "https://github.com/naresh-devula/naresh-devula.github.io"
      path_to_docs: "book"
      repository_branch: "main"
      use_edit_page_button: false
      use_repository_button: true
      use_issues_button: false
      launch_buttons:
        thebe: true
        colab_url: "https://colab.research.google.com"
      collapse_navigation: true
    html_show_copyright: false
    html_last_updated_fmt: "%B %-d, %Y"
    html_static_path: ["figures", "_static"]
    mathjax3_config:
      chtml:
        mtextInheritFont: true

  extra_extensions:
    - sphinx_sitemap
    - sphinxext.opengraph
    - sphinx.ext.imgconverter
    - jupyterbook_patches
    - download_link_replacer
    - sphinx.ext.extlinks
    - sphinx_image_inverter
    - sphinx_iframes
    - sphinx_exercise
    - teachbooks_sphinx_tippy
    - sphinx_named_colors
    - sphinx_accessibility
    - manim_slides.docs.manim_slides_directive

bibtex_bibfiles:
  - references.bib
